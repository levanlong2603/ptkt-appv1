# /etc/nginx/sites-available/ptkt
# Bản dùng khi ứng dụng đứng SAU bộ cân bằng tải A10 (VIP 192.168.20.100).
#
# !!! SỬA DÒNG $ptkt_node BÊN DƯỚI CHO ĐÚNG TỪNG MÁY: "SERVER3" hoặc "SERVER4" !!!
# Đây là file DUY NHẤT khác nhau giữa hai máy (ngoài DB_HOST trong .env).

# IP thật của người dùng: ưu tiên header A10 chèn; nếu không có thì dùng IP kết nối.
# (Bắt buộc, nếu không mọi người dùng sẽ bị tính chung một IP và cơ chế chặn
#  "sai mật khẩu 10 lần / 15 phút" trong server.js sẽ khoá cả phòng cùng lúc.)
map $http_x_forwarded_for $ptkt_client_ip {
    ""      $remote_addr;
    default $http_x_forwarded_for;
}

# Giao thức người dùng thực sự dùng khi vào VIP (A10 có thể làm HTTPS offload).
map $http_x_forwarded_proto $ptkt_proto {
    ""      $scheme;
    default $http_x_forwarded_proto;
}

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 10m;

    # Header cho biết máy nào đang phục vụ – xem bằng F12 → Network, hoặc curl -I
    # >>> SERVER4 đổi dòng này thành "SERVER4" <<<
    add_header X-Served-By "SERVER3" always;

    # Kênh cập nhật thời gian thực – không được đệm
    location /api/events {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $ptkt_client_ip;
        proxy_set_header X-Forwarded-For $ptkt_client_ip;
        proxy_set_header X-Forwarded-Proto $ptkt_proto;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $ptkt_client_ip;
        proxy_set_header X-Forwarded-For $ptkt_client_ip;
        proxy_set_header X-Forwarded-Proto $ptkt_proto;
    }
}
