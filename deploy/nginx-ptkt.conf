# /etc/nginx/sites-available/ptkt
# Máy chủ chạy nhiều web nội bộ, mỗi web một cổng ngoài riêng qua Nginx.
# Web này (NGSI PTKT) nghe ở cổng ngoài 8080, proxy vào Node nội bộ ở 127.0.0.1:3000.
server {
    listen 8080;
    server_name _;

    client_max_body_size 10m;

    # Kênh cập nhật thời gian thực – không được đệm
    location /api/events {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
